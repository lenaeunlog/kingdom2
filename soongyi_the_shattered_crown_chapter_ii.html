        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.sfxGain = null;
                this.currentAudio = null;
                this.musicUrl = '';
                this.volume = 0.35;
                this.isMusicMuted = false;
                this.isSfxMuted = false;
                this.unlocked = false;
                this.loadingTimer = null;
                this.playRequestId = 0;
                this.musicStatus = {
                    kind: 'loading', message: 'Attempting automatic background music playback...', url: ''
                };
                this.listeners = new Set();
            }

            subscribe(listener) {
                this.listeners.add(listener);
                listener(this.musicStatus);
                return () => this.listeners.delete(listener);
            }

            setStatus(kind, message, url = this.musicUrl) {
                const old = this.musicStatus;
                if (old.kind === kind && old.message === message && old.url === url) return;
                this.musicStatus = { kind, message, url };
                this.listeners.forEach(listener => listener(this.musicStatus));
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return false;
                    try {
                        this.ctx = new AudioContextClass();
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.gain.value = 0.5;
                        this.sfxGain.connect(this.ctx.destination);
                    } catch (err) {
                        console.warn('Sound effects unavailable:', err);
                        this.ctx = null;
                        return false;
                    }
                }
                if (this.ctx.state === 'suspended') {
                    try {
                        const result = this.ctx.resume();
                        if (result && result.catch) {
                            result.catch(err => console.warn('Sound context could not resume:', err));
                        }
                    } catch (err) { console.warn('Sound context could not resume:', err); }
                }
                return true;
            }

            unlock() {
                this.unlocked = true;
                this.init();
                if (this.currentAudio && this.currentAudio.paused && !this.currentAudio.error) {
                    this.tryPlay(this.currentAudio);
                }
            }

            clearLoadingTimer() {
                if (this.loadingTimer !== null) {
                    clearTimeout(this.loadingTimer);
                    this.loadingTimer = null;
                }
            }

            describeAudioError(audio) {
                const code = audio.error && audio.error.code;
                if (code === 2) return 'Network error while loading MP3.';
                if (code === 3) return 'MP3 decoding error.';
                if (code === 4) return 'Unable to load MP3.';
                return 'The MP3 could not be loaded.';
            }

            tryPlay(audio) {
                if (this.currentAudio !== audio) return;
                this.clearLoadingTimer();
                const requestId = ++this.playRequestId;
                this.setStatus('loading', 'Loading MP3 track...');
                this.loadingTimer = setTimeout(() => {
                    if (this.currentAudio === audio && audio.paused && !audio.error) {
                        this.setStatus('slow', 'MP3 loading is slow.');
                    }
                }, 12000);
                try {
                    const result = audio.play();
                    if (result && typeof result.catch === 'function') {
                        result.catch(err => {
                            if (this.currentAudio !== audio || this.playRequestId !== requestId) return;
                            this.clearLoadingTimer();
                            if (err && err.name === 'AbortError') return;
                            if (err && err.name === 'NotAllowedError') {
                                this.setStatus('blocked', 'Music starts on your first click or key press.');
                            } else {
                                this.setStatus('error', 'Cannot play this MP3 track.');
                            }
                        });
                    }
                } catch (err) {
                    if (this.currentAudio !== audio || this.playRequestId !== requestId) return;
                    this.clearLoadingTimer();
                    this.setStatus('error', 'Cannot start MP3 playback.');
                }
            }

            playBGM(url, loop = true, force = false) {
                if (!url) return;
                if (!force && this.currentAudio && this.musicUrl === url) {
                    this.currentAudio.loop = loop;
                    if (this.unlocked && this.currentAudio.paused &&
                        this.musicStatus.kind === 'blocked') {
                        this.tryPlay(this.currentAudio);
                    }
                    return;
                }

                this.stopBGM(false);
                const audio = new Audio();
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = this.volume;
                audio.muted = this.isMusicMuted;
                this.currentAudio = audio;
                this.musicUrl = url;

                audio.addEventListener('playing', () => {
                    if (this.currentAudio !== audio) return;
                    this.clearLoadingTimer();
                    this.setStatus('playing', this.isMusicMuted ? 'Music playing (muted).' : 'Music playing.');
                });
                audio.addEventListener('waiting', () => {
                    if (this.currentAudio === audio && !audio.paused) {
                        this.setStatus('loading', 'Buffering MP3...');
                    }
                });
                audio.addEventListener('stalled', () => {
                    if (this.currentAudio === audio && !audio.error) {
                        this.setStatus('slow', 'MP3 download stalled.');
                    }
                });
                audio.addEventListener('error', () => {
                    if (this.currentAudio !== audio) return;
                    this.clearLoadingTimer();
                    this.setStatus('error', this.describeAudioError(audio));
                });
                this.setStatus('loading', 'Attempting automatic playback...');
                audio.src = url;
                this.tryPlay(audio);
            }

            retryBGM() {
                const url = this.musicUrl;
                if (!url) return;
                this.unlock();
                this.playBGM(url, true, true);
            }

            stopBGM(updateStatus = true) {
                this.clearLoadingTimer();
                const audio = this.currentAudio;
                this.currentAudio = null;
                this.musicUrl = '';
                if (audio) {
                    try {
                        audio.pause();
                        audio.removeAttribute('src');
                        audio.load();
                    } catch (err) { console.warn('Audio cleanup:', err); }
                }
                if (updateStatus) this.setStatus('idle', 'No track selected.');
            }

            setMusicVolume(value) {
                const number = Number(value);
                this.volume = Number.isFinite(number) ? Math.max(0, Math.min(1, number)) : 0.35;
                if (this.currentAudio) this.currentAudio.volume = this.volume;
            }

            setMusicMuted(muted) {
                this.isMusicMuted = !!muted;
                if (this.currentAudio) this.currentAudio.muted = this.isMusicMuted;
            }

            setSfxMuted(muted) { this.isSfxMuted = !!muted; }

            playSfx(type) {
                if (this.isSfxMuted || !this.init()) return;
                const now = this.ctx.currentTime;
                if (type === 'restore') {
                    const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
                    notes.forEach((freq, idx) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.connect(g);
                        g.connect(this.sfxGain);
                        o.frequency.setValueAtTime(freq, now + idx * 0.08);
                        g.gain.setValueAtTime(0.2, now + idx * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                        o.start(now + idx * 0.08);
                        o.stop(now + idx * 0.08 + 0.3);
                    });
                    return;
                }
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.sfxGain);
                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(130, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else {
                    osc.disconnect();
                    gain.disconnect();
                }
            }
        }

        const soundEngine = new SoundEngine();

        const resumeGameAudio = () => soundEngine.unlock();
        window.addEventListener('pointerdown', resumeGameAudio, { capture: true, passive: true });
        window.addEventListener('touchstart', resumeGameAudio, { capture: true, passive: true });
        window.addEventListener('keydown', resumeGameAudio, { capture: true });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && soundEngine.unlocked && soundEngine.currentAudio &&
                soundEngine.currentAudio.paused && !soundEngine.currentAudio.error) {
                soundEngine.tryPlay(soundEngine.currentAudio);
            }
        });

        function ParticleCanvas() {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let width = (canvas.width = window.innerWidth);
                let height = (canvas.height = window.innerHeight);

                const particles = Array.from({ length: 35 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 0.5,
                    color: Math.random() > 0.5 ? 'rgba(214, 180, 106, 0.6)' : 'rgba(185, 169, 216, 0.5)',
                    speedY: Math.random() * 0.4 + 0.1,
                    speedX: (Math.random() - 0.5) * 0.3
                }));

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.y -= p.speedY;
                        p.x += p.speedX;
                        if (p.y < 0) {
                            p.y = height + 10;
                            p.x = Math.random() * width;
                        }
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });
                    animationFrameId = requestAnimationFrame(render);
                };
                render();

                const handleResize = () => {
                    if (!canvas) return;
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);
                return () => {
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas id="particle-canvas" ref={canvasRef} />;
        }

                                            <div className="p-4 bg-royalPurple/60 rounded-xl border border-antiqueGold/30">
                                                <h4 className="font-bold text-rose-300 mb-1">🕯️ 4. 기억의 선언</h4>
                                                <p className="text-ivoryText/80">가라앉았던 고대의 문장과 기록들이 다시 밝은 빛을 발한다.</p>
                                            </div>
                                        </div>
                                        <div className="flex justify-center space-x-4 pt-4">
                                            <button onClick={() => setEndingStep(0)} className="btn-outline px-6 py-2 rounded-full font-cinzel text-xs">
                                                ← 이전
                                            </button>
                                            <button onClick={() => setEndingStep(2)} className="btn-gold px-8 py-3 rounded-full font-cinzel font-bold text-base">
                                                {language === 'KO' ? '숭이의 영원한 영예 확인 →' : 'See Eternal Glory →'}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {endingStep === 2 && (
                                    <div className="space-y-6">
                                        <div className="text-7xl mb-2 crown-glow">🏆 🌟 🏰</div>
                                        <h2 className="font-cursive text-5xl text-antiqueGold">
                                            {language === 'KO' ? '영원히 기억될 이름, 숭이' : 'Long Live Soongyi!'}
                                        </h2>
                                        <p className="font-serif text-base text-ivoryText/90 leading-relaxed max-w-xl mx-auto">
                                            {language === 'KO'
                                                ? '왕관의 빛이 온 영토를 가득 채우며 찬란한 평화가 찾아왔습니다. 언어와 지혜의 힘으로 숭숭이 여왕의 왕국을 구원한 숭이의 전설은 오래도록 노래로 전해질 것입니다.'
                                                : 'With the crown restored, eternal peace washes over Kingdom of Queen Soongsoongyi. Soongyi\'s tale of language and insight will be sung for generations.'}
                                        </p>
                                        <div className="flex justify-center space-x-4 pt-4">
                                            <button onClick={() => setEndingStep(1)} className="btn-outline px-6 py-2 rounded-full font-cinzel text-xs">
                                                ← 이전
                                            </button>
                                            <button onClick={resetFullGame} className="btn-gold px-10 py-4 rounded-full font-cinzel font-bold text-lg uppercase tracking-wider shadow-2xl hover:scale-105 transition-transform">
                                                {language === 'KO' ? '제 2장 다시 플레이' : 'Replay Chapter II'}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* BOTTOM CHRONICLE LOG & FOOTER */}
                    <footer className="w-full max-w-6xl px-6 py-4 z-20 flex flex-col md:flex-row justify-between items-center text-xs text-silverPurple/70 border-t border-antiqueGold/20 mt-4">
                        <div className="flex items-center space-x-2 mb-2 md:mb-0">
                            <span className="font-bold text-antiqueGold">Chronicle Log:</span>
                            <span className="italic">{logs[0] || 'Awaiting actions...'}</span>
                        </div>
                        <div>
                            <span>Soongyi Chronicles © Chapter II</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
